# =============================================================================
# scd2_conventions.yml
# =============================================================================
# Defines the standard naming convention for SCD2 system-generated columns.
#
# PURPOSE:
#   These column names are NOT copied from any existing table in the database.
#   They are the organisation's agreed standard for SCD2 dimension output.
#   The generator reads this file to name system columns when producing any
#   dbt model via the incremental_scd2 materialization.
#
# HOW IT WORKS:
#   - Source-derived columns: renamed using a PascalCase transform applied to
#     the source column names as they appear in OpenMetadata (all-caps Snowflake
#     identifiers are split on underscore and title-cased per word).
#     Example: FIRST_NAME → FirstName, CUSTOMER_ID → CustomerId
#
#   - Acronym exceptions: known acronyms are preserved in uppercase.
#     Example: CUSTOMER_HASH_PK → CustomerHashPK  (not CustomerHashPk)
#     Registered acronyms: PK, BK, FK, ID, SCD, ERP, CRM, DW, ETL
#
#   - SCD2 system columns: named by this file. These columns do not exist in
#     the source — they are generated by the materialization. Their names are
#     fixed by convention, not by the source schema or any target table.
#
# UPDATING THIS FILE:
#   Changing a name here changes the generated column name for ALL models
#   that use the incremental_scd2 materialization on the next generation pass.
#   Any existing target tables must be migrated before running the new model.
# =============================================================================

# ── Surrogate / hash key columns ──────────────────────────────────────────────
surrogate_pk_suffix:    "HashPK"       # appended to entity name  → CustomerHashPK
surrogate_bk_suffix:    "HashBK"       # appended to entity name  → CustomerHashBK
source_bk_suffix:       "BK"           # appended to 'Source' + entity name → SourceCustomerBK

# ── Change detection ───────────────────────────────────────────────────────────
hashbytes_col:          "Hashbytes"    # SHA2 of tracked business attributes

# ── SCD2 interval columns ──────────────────────────────────────────────────────
valid_from_col:         "EffectiveStartDateTime"
valid_to_col:           "EffectiveEndDateTime"
valid_to_sentinel:      "9999-12-31 18:59:59.999 -0500"   # open-ended current row

# ── Current row flag ───────────────────────────────────────────────────────────
current_flag_col:       "CurrentFlagYN"     # Y = current version, N = historical
current_flag_true:      "Y"
current_flag_false:     "N"

# ── PascalCase transform rules ─────────────────────────────────────────────────
pascal_acronyms:
  - PK
  - BK
  - FK
  - ID
  - SCD
  - ERP
  - CRM
  - DW
  - ETL
  - YN

# ── Source column stripping ────────────────────────────────────────────────────
# Columns with these prefixes are technical/ingestion metadata and are excluded
# from business attribute lists and hash_cols by the generator.
exclude_prefixes:
  - "_FIVETRAN"
  - "_DBT"
  - "_LOADED"
